<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Library - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .table-container::-webkit-scrollbar {
            height: 6px;
        }
        
        .table-container::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Responsive Mobile Header -->
    <header class="bg-slate-900 text-white shadow-md shrink-0 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-2.5 min-w-0">
                <div class="bg-indigo-500 p-2 rounded-lg shrink-0">
                    <i class="fa-solid fa-server text-sm sm:text-base"></i>
                </div>
                <div class="truncate">
                    <span class="text-base sm:text-lg font-bold tracking-wide block leading-tight truncate">Friends Library</span>
                    <span class="text-[10px] text-slate-400 font-medium sm:hidden block">Admin Portal</span>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-4 text-xs shrink-0">
                <span class="text-slate-300 hidden md:inline"><i class="fa-regular fa-calendar mr-1"></i> <span id="currentDateDisplay"></span></span>
                <button id="logoutBtn" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg transition border border-slate-700 text-xs font-medium">Logout</button>
            </div>
        </div>
    </header>

    <main class="grow p-3 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full space-y-5">
        <!-- Live Seat Availability Map -->
        <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                <h3 class="text-sm sm:text-base font-bold text-slate-800"><i class="fa-solid fa-chair mr-2"></i>Live Seat Availability Map</h3>
                <div class="flex items-center space-x-4 text-xs font-medium text-slate-600">
                    <span class="flex items-center"><span class="w-2.5 h-2.5 rounded bg-emerald-100 border border-emerald-300 mr-1.5"></span> Available</span>
                    <span class="flex items-center"><span class="w-2.5 h-2.5 rounded bg-red-100 border border-red-300 mr-1.5"></span> Occupied</span>
                </div>
            </div>

            <!-- UPDATED GRID: 10 columns on desktop so rows A-H fit perfectly -->
            <div id="seat-grid" class="grid grid-cols-2 sm:grid-cols-5 md:grid-cols-10 gap-2.5">
                <!-- Populated dynamically -->
            </div>
        </div>

        <!-- Responsive Stat Cards -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
            <div class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-indigo-500">
                <p class="text-[11px] sm:text-xs text-slate-500 font-semibold uppercase">Total Members</p>
                <h3 class="text-xl sm:text-2xl font-bold text-slate-800 mt-0.5" id="stat-total">0</h3>
            </div>
            <div class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-500 flex flex-col justify-between">
                <div class="flex justify-between items-center">
                    <p class="text-[11px] sm:text-xs text-slate-500 font-semibold uppercase">Revenue</p>
                    <button onclick="toggleTotalRevenue()" class="text-slate-400 hover:text-slate-600" title="Show/Hide">
                        <i class="fa-solid fa-eye text-xs" id="total-revenue-icon"></i>
                    </button>
                </div>
                <h3 class="text-xl sm:text-2xl font-bold text-slate-800 mt-0.5" id="stat-profit">₹••••</h3>
            </div>
            <div class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[11px] sm:text-xs text-slate-500 font-semibold uppercase">6H Shift</p>
                <h3 class="text-xl sm:text-2xl font-bold text-slate-800 mt-0.5" id="stat-6h">0</h3>
            </div>
            <div class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[11px] sm:text-xs text-slate-500 font-semibold uppercase">12H Shift</p>
                <h3 class="text-xl sm:text-2xl font-bold text-slate-800 mt-0.5" id="stat-12h">0</h3>
            </div>
            <div class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200 col-span-2 sm:col-span-1">
                <p class="text-[11px] sm:text-xs text-slate-500 font-semibold uppercase">24H Shift</p>
                <h3 class="text-xl sm:text-2xl font-bold text-slate-800 mt-0.5" id="stat-24h">0</h3>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex flex-col sm:flex-row gap-2.5 justify-between">
                <div class="grid grid-cols-2 sm:flex gap-2">
                    <select id="filter-shift" class="bg-slate-50 border border-slate-300 text-xs sm:text-sm rounded-lg px-2.5 py-2 outline-none">
                        <option value="All">All Shifts</option>
                        <option value="6 Hours">6 Hours</option>
                        <option value="12 Hours">12 Hours</option>
                        <option value="24 Hours">24 Hours</option>
                    </select>
                    <select id="filter-status" class="bg-slate-50 border border-slate-300 text-xs sm:text-sm rounded-lg px-2.5 py-2 outline-none">
                        <option value="All">All Statuses</option>
                        <option value="Safe">Paid / Active</option>
                        <option value="Due Soon">Due Soon (≤3 Days)</option>
                        <option value="Overdue">Overdue</option>
                    </select>
                </div>
                <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-300 text-center">
                    <button onclick="switchView('active')" id="tab-active" class="flex-1 px-2.5 py-1 text-xs font-semibold rounded-md bg-indigo-600 text-white transition">Active</button>
                    <button onclick="switchView('pending')" id="tab-pending" class="flex-1 px-2.5 py-1 text-xs font-semibold rounded-md text-slate-600 transition">Pending</button>
                    <button onclick="switchView('past')" id="tab-past" class="flex-1 px-2.5 py-1 text-xs font-semibold rounded-md text-slate-600 transition">Past</button>
                </div>
            </div>
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                <input type="text" id="search-bar" placeholder="Search student name, phone, or seat..." class="w-full bg-slate-50 border border-slate-300 text-xs sm:text-sm rounded-lg pl-8 pr-3 py-2 outline-none">
            </div>
        </div>

        <!-- Action Buttons Row -->
        <div class="flex flex-wrap justify-between items-center gap-2">
            <div class="flex space-x-3 text-xs font-medium text-slate-600" id="legend-container">
                <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-white border border-slate-300 mr-1.5"></span> Paid</span>
                <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-amber-200 border border-amber-300 mr-1.5"></span> Due</span>
                <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-red-200 border border-red-300 mr-1.5"></span> Overdue</span>
            </div>
            <div class="flex space-x-2 w-full sm:w-auto" id="action-buttons-container">
                <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" class="hidden" onchange="uploadExcel(event)">
                <button onclick="document.getElementById('excelUpload').click()" class="flex-1 sm:flex-none bg-emerald-600 text-white text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg">
                    <i class="fa-solid fa-file-excel mr-1"></i> Excel
                </button>
                <button onclick="openAddModal()" class="flex-1 sm:flex-none bg-indigo-600 text-white text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg">
                    <i class="fa-solid fa-plus mr-1"></i> Add Student
                </button>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto table-container">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="bg-slate-800 text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="px-4 py-3 font-medium">Photo</th>
                            <th class="px-4 py-3 font-medium">Seat</th>
                            <th class="px-4 py-3 font-medium">Name</th>
                            <th class="px-4 py-3 font-medium">Shift</th>
                            <th class="px-4 py-3 font-medium">Mobile</th>
                            <th class="px-4 py-3 font-medium">Aadhaar</th>
                            <th class="px-4 py-3 font-medium" id="date-column-header">Joined</th>
                            <th class="px-4 py-3 font-medium">Plan</th>
                            <th class="px-4 py-3 font-medium">Card</th>
                            <th class="px-4 py-3 font-medium">Fees</th>
                            <th class="px-4 py-3 font-medium">Mode</th>
                            <th class="px-4 py-3 font-medium">Last Paid</th>
                            <th class="px-4 py-3 font-medium">Due Date</th>
                            <th class="px-4 py-3 font-medium text-center" id="action-column-header">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body" class="text-sm divide-y divide-slate-200 text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="studentModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[92vh] flex flex-col overflow-hidden">
            <div class="px-5 py-3.5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="text-base font-bold text-slate-800" id="modalTitle">Add Student</h3>
                <button type="button" onclick="toggleModal('studentModal')" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto">
                <form id="studentForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4" enctype="multipart/form-data">
                    <input type="hidden" id="studentId">
                    <div class="sm:col-span-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Student Photograph</label>
                        <input type="file" id="add-photo" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Name</label>
                        <input type="text" id="add-name" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Mobile Number</label>
                        <input type="text" id="add-mobile" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Aadhaar Number</label>
                        <input type="text" id="add-aadhar" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Joining Date</label>
                        <input type="date" id="add-joiningDate" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Seat No</label>
                        <input type="text" id="add-seatNo" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none" placeholder="e.g. A1">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Shift</label>
                        <select id="add-shift" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                            <option value="6 Hours">6 Hours</option>
                            <option value="12 Hours">12 Hours</option>
                            <option value="24 Hours">24 Hours</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Card No</label>
                        <input type="text" id="add-cardNo" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Plan</label>
                        <select id="add-plan" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                            <option value="Monthly">Monthly</option>
                            <option value="Quarterly">Quarterly</option>
                            <option value="Half-Yearly">Half-Yearly</option>
                            <option value="Yearly">Yearly</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fee (₹)</label>
                        <input type="number" id="add-fee" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Mode</label>
                        <select id="add-mode" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                            <option value="UPI">UPI</option>
                            <option value="Cash">Cash</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Last Paid</label>
                        <input type="date" id="add-lastPaid" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Due Date</label>
                        <input type="date" id="add-dueDate" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Remarks</label>
                        <input type="text" id="add-remarks" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    </div>
                </form>
            </div>
            <div class="px-5 py-3 border-t border-slate-200 bg-slate-50 flex justify-end space-x-2">
                <button type="button" onclick="toggleModal('studentModal')" class="px-3.5 py-1.5 text-xs font-medium text-slate-600">Cancel</button>
                <button type="submit" form="studentForm" class="bg-indigo-600 text-white px-5 py-1.5 rounded-lg text-xs font-medium">Save</button>
            </div>
        </div>
    </div>

    <script>
        const today = new Date();
        const formattedToday = today.toISOString().split('T')[0];
        document.getElementById('currentDateDisplay').innerText = today.toLocaleDateString('en-IN', {
            weekday: 'short',
            year: 'numeric',
            month: 'short',
            day: 'numeric'
        });

        let dbStudents = [];
        let pendingStudents = [];
        let pastMembers = [];
        let currentView = 'active';
        let calculatedRevenue = 0;
        let isRevenueVisible = false;

        const API_BASE = '/api';

        if (!localStorage.getItem('isLoggedIn')) window.location.href = 'login.html';
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'login.html';
        });

        async function fetchData() {
            try {
                const resStudents = await fetch(`${API_BASE}/students`);
                if (resStudents.ok) dbStudents = await resStudents.json();

                const resPending = await fetch(`${API_BASE}/pending-registrations`);
                if (resPending.ok) pendingStudents = await resPending.json();

                const resPast = await fetch(`${API_BASE}/past-members`);
                if (resPast.ok) pastMembers = await resPast.json();

                loadSeatMatrix();
                applyFilters();
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function switchView(view) {
            currentView = view;
            const tabActive = document.getElementById('tab-active');
            const tabPending = document.getElementById('tab-pending');
            const tabPast = document.getElementById('tab-past');
            const legend = document.getElementById('legend-container');
            const actionButtons = document.getElementById('action-buttons-container');

            tabActive.className = "flex-1 px-2.5 py-1 text-xs font-semibold rounded-md text-slate-600 transition";
            tabPending.className = "flex-1 px-2.5 py-1 text-xs font-semibold rounded-md text-slate-600 transition";
            tabPast.className = "flex-1 px-2.5 py-1 text-xs font-semibold rounded-md text-slate-600 transition";

            if (view === 'active') {
                tabActive.className = "flex-1 px-2.5 py-1 text-xs font-semibold rounded-md bg-indigo-600 text-white transition";
                if (legend) legend.style.display = 'flex';
                if (actionButtons) actionButtons.style.display = 'flex';
            } else if (view === 'pending') {
                tabPending.className = "flex-1 px-2.5 py-1 text-xs font-semibold rounded-md bg-amber-600 text-white transition";
                if (legend) legend.style.display = 'none';
                if (actionButtons) actionButtons.style.display = 'none';
            } else {
                tabPast.className = "flex-1 px-2.5 py-1 text-xs font-semibold rounded-md bg-slate-800 text-white transition";
                if (legend) legend.style.display = 'none';
                if (actionButtons) actionButtons.style.display = 'none';
            }
            applyFilters();
        }

        async function loadSeatMatrix() {
            try {
                const response = await fetch(`${API_BASE}/seats-shift-status`);
                const data = await response.json();
                const seatMapping = data.seatMapping || {};
                const gridContainer = document.getElementById('seat-grid');
                if (!gridContainer) return;

                gridContainer.innerHTML = '';

                // Generate new seat array (A1-H10, I1-I13)
                const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
                const allSeatNames = [];
                rows.forEach(row => {
                    const maxSeats = (row === 'I') ? 13 : 10;
                    for (let i = 1; i <= maxSeats; i++) {
                        allSeatNames.push(`${row}${i}`);
                    }
                });

                for (const seatName of allSeatNames) {
                    const seatData = seatMapping[seatName];
                    const isOccupied = !!seatData;

                    const seatDiv = document.createElement('div');
                    seatDiv.className = `p-2.5 rounded-lg text-center text-xs font-semibold flex flex-col items-center justify-center border shadow-xs ${
                        isOccupied ? 'bg-red-50 border-red-200 text-red-800' : 'bg-emerald-50 border-emerald-200 text-emerald-800 hover:bg-emerald-100 cursor-pointer'
                    }`;

                    if (isOccupied) {
                        seatDiv.innerHTML = `
                            <div class="flex items-center justify-between w-full mb-0.5">
                                <i class="fa-solid fa-user-lock text-red-500 text-[10px]"></i>
                                <span class="text-[9px] font-bold bg-red-100 text-red-700 px-1 rounded">${seatData.shift}</span>
                            </div>
                            <span class="font-bold text-xs text-slate-900">${seatName}</span>
                            <span class="text-[10px] text-slate-600 truncate w-full" title="${seatData.studentName}">${seatData.studentName}</span>
                        `;
                    } else {
                        seatDiv.innerHTML = `
                            <i class="fa-solid fa-chair text-emerald-600 text-xs mb-0.5"></i>
                            <span class="font-bold text-xs text-slate-800">${seatName}</span>
                            <span class="text-[9px] text-emerald-700 font-medium">Available</span>
                        `;
                        seatDiv.onclick = function() {
                            openAddModal();
                            document.getElementById('add-seatNo').value = seatName;
                        };
                    }
                    gridContainer.appendChild(seatDiv);
                }
            } catch (error) {
                console.error("Error loading seat matrix:", error);
            }
        }

        setInterval(loadSeatMatrix, 30000);

        function getDaysDiff(dueDateStr) {
            const dueDate = new Date(dueDateStr);
            const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const d = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
            return Math.ceil((d - t) / (1000 * 60 * 60 * 24));
        }

        function sendWhatsAppReminder(name, mobile, fee, dueDate, seatNo) {
            let phone = mobile.toString().replace(/\D/g, '');
            if (phone.length === 10) phone = '91' + phone;

            const message = `Hello *${name}*,\n\nThis is a reminder from *Friends Library*.\n\nYour membership fee of *₹${fee}* for Seat *${seatNo}* is due on *${dueDate}*.\n\nPlease submit your fee on time to keep your seat active.\n\nRegards,\n*Friends Library Management*`;
            const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        function renderTable(data) {
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';
            calculatedRevenue = 0;

            const dateHeader = document.getElementById('date-column-header');
            const actionHeader = document.getElementById('action-column-header');

            if (currentView === 'past') {
                dateHeader.innerText = "Deleted At";
                actionHeader.style.display = 'none';
            } else if (currentView === 'pending') {
                dateHeader.innerText = "Submitted At";
                actionHeader.style.display = 'table-cell';
                actionHeader.innerText = "Approval Action";
            } else {
                dateHeader.innerText = "Joining Date";
                actionHeader.style.display = 'table-cell';
                actionHeader.innerText = "Actions";
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="14" class="text-center py-6 text-slate-500">No records found.</td></tr>`;
                return;
            }

            data.forEach(student => {
                        if (currentView === 'active') calculatedRevenue += Number(student.fee) || 0;
                        const daysDiff = currentView === 'active' ? getDaysDiff(student.dueDate) : 0;
                        let rowBgClass = "bg-white hover:bg-slate-50";

                        if (currentView === 'active') {
                            if (daysDiff < 0) rowBgClass = "bg-red-50 text-red-900";
                            else if (daysDiff <= 3) rowBgClass = "bg-amber-50 text-amber-900";
                        }

                        const photoUrl = student.photo ? student.photo : `https://ui-avatars.com/api/?name=${encodeURIComponent(student.name)}&background=4f46e5&color=fff`;
                        const tr = document.createElement('tr');
                        tr.className = `border-b border-slate-200 ${rowBgClass}`;

                        let actionHtml = '';
                        if (currentView === 'active') {
                            let waButton = '';
                            if (daysDiff <= 3) {
                                waButton = `<button onclick="sendWhatsAppReminder('${student.name}', '${student.mobile}', '${student.fee}', '${student.dueDate}', '${student.seatNo}')" class="text-emerald-600 hover:text-emerald-800 p-1 mr-1.5" title="Send WhatsApp Reminder"><i class="fa-brands fa-whatsapp text-lg"></i></button>`;
                            }

                            actionHtml = `
                        <td class="px-3 py-2.5 text-center whitespace-nowrap">
                            ${waButton}
                            <button onclick="printReceipt(${student.id})" class="text-slate-600 hover:text-slate-800 p-1 mr-1" title="Print Receipt"><i class="fa-solid fa-print"></i></button>
                            <button onclick="adjustLeave(${student.id}, '${student.name}', '${student.dueDate}')" class="text-amber-500 hover:text-amber-700 p-1 mr-1" title="Adjust Leave"><i class="fa-solid fa-calendar-plus"></i></button>
                            <button onclick="editStudent(${student.id})" class="text-indigo-600 hover:text-indigo-800 p-1 mr-1" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteStudent(${student.id})" class="text-red-500 hover:text-red-700 p-1" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    `;
                        } else if (currentView === 'pending') {
                            actionHtml = `
                        <td class="px-3 py-2.5 text-center whitespace-nowrap">
                            <button onclick="approveRegistration(${student.id})" class="bg-emerald-600 text-white px-2.5 py-1 rounded text-xs mr-1"><i class="fa-solid fa-check"></i></button>
                            <button onclick="rejectRegistration(${student.id})" class="bg-red-600 text-white px-2.5 py-1 rounded text-xs"><i class="fa-solid fa-xmark"></i></button>
                        </td>
                    `;
                        }

                        tr.innerHTML = `
                    <td class="px-3 py-2.5">
                        <img src="${photoUrl}" alt="${student.name}" class="w-8 h-8 rounded-full object-cover">
                    </td>
                    <td class="px-3 py-2.5 font-bold">${student.seatNo}</td>
                    <td class="px-3 py-2.5 font-medium">${student.name}</td>
                    <td class="px-3 py-2.5 text-xs">${student.shift}</td>
                    <td class="px-3 py-2.5 text-xs">${student.mobile}</td>
                    <td class="px-3 py-2.5 text-xs">${student.aadhar || '-'}</td>
                    <td class="px-3 py-2.5 text-xs">${currentView === 'past' ? (student.deleted_at ? student.deleted_at.substring(0, 10) : '-') : (student.joiningDate || '-')}</td>
                    <td class="px-3 py-2.5 text-xs">${student.plan}</td>
                    <td class="px-3 py-2.5 text-xs">${student.cardNo || '-'}</td>
                    <td class="px-3 py-2.5 font-semibold text-emerald-600">
                        ${currentView === 'active' ? `
                            <span id="fee-text-${student.id}">₹••••</span>
                            <button onclick="toggleFee(${student.id},${student.fee})" class="ml-1 text-slate-400">
                                <i class="fa-solid fa-eye text-xs" id="fee-icon-${student.id}"></i>
                            </button>
                        ` : `₹${student.fee}`}
                    </td>
                    <td class="px-3 py-2.5 text-xs">${student.mode}</td>
                    <td class="px-3 py-2.5 text-xs">${student.lastPaid}</td>
                    <td class="px-3 py-2.5 font-bold text-xs">${student.dueDate}</td>
                    ${actionHtml}
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-total').innerText = dbStudents.length;
            const revenueElem = document.getElementById('stat-profit');
            revenueElem.innerText = isRevenueVisible ? `₹${calculatedRevenue.toLocaleString('en-IN')}` : '₹••••';
            document.getElementById('stat-6h').innerText = dbStudents.filter(s => s.shift === '6 Hours').length;
            document.getElementById('stat-12h').innerText = dbStudents.filter(s => s.shift === '12 Hours').length;
            document.getElementById('stat-24h').innerText = dbStudents.filter(s => s.shift === '24 Hours').length;
        }

        async function approveRegistration(id) {
            if (!confirm("Approve this registration?")) return;
            try {
                const res = await fetch(`${API_BASE}/approve-registration/${id}`, { method: 'POST' });
                const data = await res.json();
                if (data.success) fetchData();
                else alert("Approval failed: " + data.message);
            } catch (err) { console.error(err); }
        }

        async function rejectRegistration(id) {
            if (!confirm("Reject and delete registration?")) return;
            try {
                const res = await fetch(`${API_BASE}/pending-registrations/${id}`, { method: 'DELETE' });
                if (res.ok) fetchData();
            } catch (err) { console.error(err); }
        }

        async function adjustLeave(id, name, currentDueDate) {
            const days = prompt(`Extend due date for ${name}\nCurrent: ${currentDueDate}\nEnter number of days:`);
            if (days && !isNaN(days) && parseInt(days) > 0) {
                try {
                    const res = await fetch(`${API_BASE}/students/${id}/adjust-leave`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ daysToAdjust: parseInt(days) })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(`Due date updated to ${data.newDueDate}`);
                        fetchData();
                    }
                } catch(err) { console.error(err); }
            }
        }

        async function printReceipt(id) {
            const student = dbStudents.find(s => s.id === id);
            if (!student) return;

            const receiptNo = 'REC-' + Date.now().toString().slice(-6);
            const paymentDate = student.lastPaid || formattedToday;

            await fetch(`${API_BASE}/receipts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_id: student.id,
                    receipt_no: receiptNo,
                    student_name: student.name,
                    seat_no: student.seatNo,
                    fee: student.fee,
                    mode: student.mode,
                    plan: student.plan,
                    payment_date: paymentDate
                })
            });

            const printWindow = window.open('', '_blank', 'width=800,height=600');
            const receiptContent = 
                '<div style="font-family:sans-serif;padding:30px;color:#334;max-width:550px;margin:auto;border:1px solid #ddd;border-radius:10px;text-align:center;">' +
                    '<h2>Friends Library</h2>' +
                    '<p>Fee Payment Receipt</p>' +
                    '<hr style="margin:15px 0;border:0;border-top:1px solid #eee;">' +
                    '<p style="text-align:left;"><strong>Receipt:</strong> ' + receiptNo + '</p>' +
                    '<p style="text-align:left;"><strong>Date:</strong> ' + paymentDate + '</p>' +
                    '<table style="width:100%;border-collapse:collapse;margin-top:15px;text-align:left;">' +
                        '<tr><th style="padding:8px;border-bottom:1px solid #eee;">Name</th><td style="padding:8px;border-bottom:1px solid #eee;">' + student.name + '</td></tr>' +
                        '<tr><th style="padding:8px;border-bottom:1px solid #eee;">Seat</th><td style="padding:8px;border-bottom:1px solid #eee;">' + student.seatNo + '</td></tr>' +
                        '<tr><th style="padding:8px;border-bottom:1px solid #eee;">Plan</th><td style="padding:8px;border-bottom:1px solid #eee;">' + student.plan + ' (' + student.shift + ')</td></tr>' +
                        '<tr><th style="padding:8px;border-bottom:1px solid #eee;">Mode</th><td style="padding:8px;border-bottom:1px solid #eee;">' + student.mode + '</td></tr>' +
                    '</table>' +
                    '<div style="margin-top:20px;text-align:right;font-size:16px;font-weight:bold;color:#059669;">Total Paid: ₹' + Number(student.fee).toLocaleString('en-IN') + '</div>' +
                '</div>';

            printWindow.document.open();
            printWindow.document.write(receiptContent);
            printWindow.document.close();

            setTimeout(() => {
                printWindow.focus();
                printWindow.print();
                printWindow.close();
            }, 250);
        }

        function toggleTotalRevenue() {
            isRevenueVisible = !isRevenueVisible;
            const revenueElem = document.getElementById('stat-profit');
            const revenueIcon = document.getElementById('total-revenue-icon');
            revenueElem.innerText = isRevenueVisible ? `₹${calculatedRevenue.toLocaleString('en-IN')}` : '₹••••';
            revenueIcon.className = isRevenueVisible ? 'fa-solid fa-eye-slash text-xs' : 'fa-solid fa-eye text-xs';
        }

        function toggleFee(id, actualFee) {
            const feeSpan = document.getElementById(`fee-text-${id}`);
            const feeIcon = document.getElementById(`fee-icon-${id}`);
            if (feeSpan.innerText.includes('••••')) {
                feeSpan.innerText = `₹${Number(actualFee).toLocaleString('en-IN')}`;
                feeIcon.className = 'fa-solid fa-eye-slash text-xs';
            } else {
                feeSpan.innerText = '₹••••';
                feeIcon.className = 'fa-solid fa-eye text-xs';
            }
        }

        function applyFilters() {
            const shiftVal = document.getElementById('filter-shift').value;
            const statusVal = document.getElementById('filter-status').value;
            const searchVal = document.getElementById('search-bar').value.toLowerCase();

            let targetSource = dbStudents;
            if (currentView === 'pending') targetSource = pendingStudents;
            else if (currentView === 'past') targetSource = pastMembers;

            const filteredData = targetSource.filter(student => {
                if (shiftVal !== 'All' && student.shift !== shiftVal) return false;
                if (searchVal && !(
                    student.name.toLowerCase().includes(searchVal) ||
                    student.mobile.includes(searchVal) ||
                    student.seatNo.toLowerCase().includes(searchVal)
                )) return false;

                if (currentView === 'active') {
                    const daysDiff = getDaysDiff(student.dueDate);
                    let currentStatus = "Safe";
                    if (daysDiff < 0) currentStatus = "Overdue";
                    else if (daysDiff <= 3) currentStatus = "Due Soon";
                    if (statusVal !== 'All' && currentStatus !== statusVal) return false;
                }
                return true;
            });
            renderTable(filteredData);
        }

        document.getElementById('filter-shift').addEventListener('change', applyFilters);
        document.getElementById('filter-status').addEventListener('change', applyFilters);
        document.getElementById('search-bar').addEventListener('keyup', applyFilters);

        function toggleModal(modalID) {
            document.getElementById(modalID).classList.toggle('hidden');
        }

        function openAddModal() {
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('modalTitle').innerText = 'Add Student';
            document.getElementById('add-joiningDate').value = formattedToday;
            document.getElementById('add-lastPaid').value = formattedToday;
            toggleModal('studentModal');
        }

        function editStudent(id) {
            const student = dbStudents.find(s => s.id === id);
            if (!student) return;

            document.getElementById('studentId').value = student.id;
            document.getElementById('add-seatNo').value = student.seatNo;
            document.getElementById('add-name').value = student.name;
            document.getElementById('add-shift').value = student.shift;
            document.getElementById('add-mobile').value = student.mobile;
            document.getElementById('add-aadhar').value = student.aadhar;
            document.getElementById('add-joiningDate').value = student.joiningDate || formattedToday;
            document.getElementById('add-plan').value = student.plan;
            document.getElementById('add-cardNo').value = student.cardNo;
            document.getElementById('add-fee').value = student.fee;
            document.getElementById('add-mode').value = student.mode;
            document.getElementById('add-lastPaid').value = student.lastPaid;
            document.getElementById('add-dueDate').value = student.dueDate;
            document.getElementById('add-remarks').value = student.remarks;
            document.getElementById('add-photo').value = "";
            document.getElementById('modalTitle').innerText = "Edit Student";
            toggleModal('studentModal');
        }

        document.getElementById('studentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('seatNo', document.getElementById('add-seatNo').value);
            formData.append('name', document.getElementById('add-name').value);
            formData.append('shift', document.getElementById('add-shift').value);
            formData.append('mobile', document.getElementById('add-mobile').value);
            formData.append('aadhar', document.getElementById('add-aadhar').value);
            formData.append('joiningDate', document.getElementById('add-joiningDate').value);
            formData.append('plan', document.getElementById('add-plan').value);
            formData.append('cardNo', document.getElementById('add-cardNo').value);
            formData.append('fee', document.getElementById('add-fee').value);
            formData.append('mode', document.getElementById('add-mode').value);
            formData.append('lastPaid', document.getElementById('add-lastPaid').value);
            formData.append('dueDate', document.getElementById('add-dueDate').value);
            formData.append('remarks', document.getElementById('add-remarks').value);

            const photoInput = document.getElementById('add-photo');
            if (photoInput.files.length > 0) formData.append('photo', photoInput.files[0]);

            const id = document.getElementById('studentId').value;
            const method = id ? 'PUT' : 'POST'; 
            const url = id ? `${API_BASE}/students/${id}` : `${API_BASE}/students`;

            try {
                const response = await fetch(url, { method: method, body: formData });
                if (response.ok) {
                    toggleModal('studentModal');
                    this.reset();
                    fetchData();
                } else alert("Failed to save student.");
            } catch (error) { console.error("Error saving student:", error); }
        });

        async function uploadExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('excel', file);

            try {
                alert("Processing Excel file...");
                const response = await fetch(`${API_BASE}/students/bulk-upload`, { method: 'POST', body: formData });
                const data = await response.json();
                if (data.success) {
                    alert(`Imported ${data.count} students.`);
                    fetchData();
                } else alert("Upload failed: " + data.message);
            } catch (error) {
                console.error("Upload error:", error);
                alert("Server error during upload.");
            } finally { event.target.value = ''; }
        }

        async function deleteStudent(id) {
            if (confirm("Delete this student? Moved to past members.")) {
                try {
                    const response = await fetch(`${API_BASE}/students/${id}`, { method: 'DELETE' });
                    if (response.ok) fetchData();
                } catch (error) { console.error("Error deleting:", error); }
            }
        }

        fetchData();
    </script>
</body>

</html>
