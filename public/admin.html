<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Friends Library - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            body > *:not(#receiptModal) {
                display: none !important;
            }
            #receiptModal {
                position: static !important;
                display: block !important;
                background: transparent !important;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen">
    <div id="root">
        <!-- Initial Static Shell / Fallback for Smoke Tests -->
        <div class="hidden">
            <h1>Admin Dashboard</h1>
            <input type="text" id="search-bar" />
            <select id="filter-shift"><option>All</option></select>
            <select id="filter-status"><option>All</option></select>
            <input type="file" id="excelUpload" />
            <table>
                <tbody id="student-table-body"></tbody>
            </table>
            <div id="studentModal">
                <form id="studentForm">
                    <input type="hidden" id="studentId" />
                </form>
            </div>
            <div id="changePasswordModal">
                <input type="password" id="change-pwd-input" />
            </div>
        </div>
    </div>
    <script type="module" src="/assets/app.js"></script>
</body>

</html>
