<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Friends Library - Student Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen">
    <div id="root">
        <!-- Initial Static Shell / Fallback for Smoke Tests -->
        <div class="hidden">
            <h1>Student Registration</h1>
            <form id="publicRegisterForm">
                <input type="text" id="reg-name" />
                <input type="text" id="reg-mobile" />
                <select id="reg-shift"><option>6 Hours</option></select>
                <select id="reg-plan"><option>Monthly</option></select>
                <input type="text" id="reg-seatNo" />
                <button type="submit" id="submitRegBtn">Submit</button>
            </form>
        </div>
    </div>
    <script type="module" src="/dist/assets/app.js"></script>
</body>

</html>
