<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Friends Library - Student Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Main Registration Form -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden border border-slate-200">
        <div class="px-6 py-5 sm:px-8 sm:py-6 bg-slate-900 text-white flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3 hover:opacity-90 transition cursor-pointer" title="Go to Home Page">
                <div class="bg-indigo-500 p-2 sm:p-2.5 rounded-xl">
                    <i class="fa-solid fa-book-open text-lg"></i>
                </div>
                <div>
                    <span class="text-base sm:text-lg font-bold tracking-wide block leading-tight">Friends Library</span>
                    <span class="text-[11px] sm:text-xs text-slate-400 mt-0.5 block">Student Registration</span>
                </div>
            </a>
            <a href="index.html" class="text-xs text-slate-300 hover:text-white flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </div>

        <div class="p-6 sm:p-8">
            <form id="publicRegisterForm" class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6" enctype="multipart/form-data">
                <div class="space-y-4 md:col-span-2">
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Student Photograph</label>
                        <input type="file" id="reg-photo" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                    <input type="text" id="reg-name" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Mobile Number</label>
                    <input type="text" id="reg-mobile" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Aadhaar Number <span class="text-slate-400 font-normal">(Optional)</span></label>
                    <input type="text" id="reg-aadhar" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="12-Digit UID (Optional)">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Requested Seat No</label>
                    <div class="flex gap-2">
                        <input type="text" id="reg-seatNo" readonly required placeholder="Click to select ->" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none text-indigo-700 font-bold cursor-not-allowed">
                        <button type="button" onclick="openSeatModal()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap shadow-sm border border-indigo-200">
                            <i class="fa-solid fa-map-location-dot"></i> Map
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Shift</label>
                    <select id="reg-shift" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="6 Hours">6 Hours</option>
                        <option value="12 Hours">12 Hours</option>
                        <option value="24 Hours">24 Hours</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Membership Plan</label>
                    <select id="reg-plan" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="Monthly">Monthly</option>
                        <option value="Quarterly">Quarterly</option>
                        <option value="Half-Yearly">Half-Yearly</option>
                        <option value="Yearly">Yearly</option>
                        <!-- CUSTOMIZE MOVED HERE -->
                        <option value="Customize">Customize</option>
                    </select>
                </div>

                <div class="md:col-span-2 mt-2">
                    <button type="submit" id="submitRegBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-md text-sm">
                        Submit Registration for Approval
                    </button>
                </div>
            </form>
            <div id="success-msg" class="hidden mt-4 p-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-xl text-center font-medium">
                <!-- Dynamically populated success message -->
            </div>
        </div>
    </div>

    <!-- Seat Selection Modal -->
    <div id="seatModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-6">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[95vh] flex flex-col overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 shrink-0">
                <div>
                    <h3 class="text-base sm:text-lg font-bold text-slate-800">Select Available Seat</h3>
                    <div class="flex items-center space-x-4 text-[10px] sm:text-xs font-medium text-slate-600 mt-1">
                        <span class="flex items-center"><span class="w-2.5 h-2.5 rounded bg-emerald-100 border border-emerald-300 mr-1.5"></span> Available</span>
                        <span class="flex items-center"><span class="w-2.5 h-2.5 rounded bg-red-50 border border-red-200 mr-1.5 opacity-60"></span> Occupied</span>
                    </div>
                </div>
                <button type="button" onclick="closeSeatModal()" class="text-slate-400 hover:text-slate-700 transition p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="p-4 sm:p-6 overflow-y-auto bg-slate-100">
                <div class="text-center text-xs text-slate-500 mb-4 hidden" id="seatLoading">
                    <i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-2xl mb-2"></i><br>Loading live seat data...
                </div>
                <div id="public-seat-grid" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-10 gap-2.5">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        const today = new Date().toISOString().split('T')[0];

        // PLAN CUSTOMIZE LISTENER: Changes the submit button text interactively
        document.getElementById('reg-plan').addEventListener('change', function(e) {
            const btn = document.getElementById('submitRegBtn');
            if (e.target.value === 'Customize') {
                btn.innerText = "Submit (Admin will consult you soon)";
            } else {
                btn.innerText = "Submit Registration for Approval";
            }
        });

        const seatModal = document.getElementById('seatModal');
        const gridContainer = document.getElementById('public-seat-grid');
        const loadingIndicator = document.getElementById('seatLoading');

        function openSeatModal() {
            seatModal.classList.remove('hidden');
            fetchSeatMap();
        }

        function closeSeatModal() {
            seatModal.classList.add('hidden');
        }

        async function fetchSeatMap() {
            gridContainer.innerHTML = '';
            loadingIndicator.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE}/seats-shift-status`);
                const data = await response.json();
                const seatMapping = data.seatMapping || {};

                loadingIndicator.classList.add('hidden');

                const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
                const allSeatNames = [];
                rows.forEach(row => {
                    const maxSeats = (row === 'I') ? 13 : 10;
                    for (let i = 1; i <= maxSeats; i++) {
                        allSeatNames.push(`${row}${i}`);
                    }
                });

                // Include any extra occupied seats (e.g. J, NR)
                Object.keys(seatMapping).forEach(extraSeat => {
                    if (!allSeatNames.includes(extraSeat) && extraSeat !== 'Pending') {
                        allSeatNames.push(extraSeat);
                    }
                });

                for (const seatName of allSeatNames) {
                    const isOccupied = !!seatMapping[seatName];
                    const seatDiv = document.createElement('div');

                    if (isOccupied) {
                        seatDiv.className = 'p-2 sm:p-3 rounded-lg text-center text-xs font-semibold flex flex-col items-center justify-center border bg-red-50 border-red-200 text-red-400 opacity-60 cursor-not-allowed';
                        seatDiv.innerHTML = `
                            <i class="fa-solid fa-user-lock text-sm sm:text-base mb-1"></i>
                            <span class="font-bold text-[10px] sm:text-xs">${seatName}</span>
                        `;
                    } else {
                        seatDiv.className = 'p-2 sm:p-3 rounded-lg text-center text-xs font-semibold flex flex-col items-center justify-center border bg-white border-emerald-300 text-emerald-700 hover:bg-emerald-500 hover:text-white hover:border-emerald-600 transition-all cursor-pointer shadow-sm group';
                        seatDiv.innerHTML = `
                            <i class="fa-solid fa-chair text-sm sm:text-base mb-1 group-hover:scale-110 transition-transform"></i>
                            <span class="font-bold text-[10px] sm:text-xs">${seatName}</span>
                        `;
                        seatDiv.onclick = function() {
                            document.getElementById('reg-seatNo').value = seatName;
                            closeSeatModal();
                        };
                    }
                    gridContainer.appendChild(seatDiv);
                }
            } catch (error) {
                console.error("Error loading seat map:", error);
                loadingIndicator.innerHTML = '<span class="text-red-500">Failed to load seat data. Please try again.</span>';
            }
        }

        document.getElementById('publicRegisterForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const seatInput = document.getElementById('reg-seatNo').value;
            if (!seatInput) {
                alert("Please select a seat from the map before submitting.");
                return;
            }

            const planSelected = document.getElementById('reg-plan').value;
            const btn = document.getElementById('submitRegBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Submitting...';

            const formData = new FormData();
            formData.append('name', document.getElementById('reg-name').value);
            formData.append('mobile', document.getElementById('reg-mobile').value);
            formData.append('aadhar', document.getElementById('reg-aadhar').value);
            formData.append('seatNo', seatInput);
            formData.append('shift', document.getElementById('reg-shift').value);
            formData.append('plan', planSelected);

            formData.append('fee', '0');
            formData.append('mode', 'Pending');
            formData.append('joiningDate', today);
            formData.append('lastPaid', today);

            const dueDate = new Date();
            dueDate.setDate(dueDate.getDate() + 30);
            formData.append('dueDate', dueDate.toISOString().split('T')[0]);

            const photoInput = document.getElementById('reg-photo');
            if (photoInput.files.length > 0) {
                formData.append('photo', photoInput.files[0]);
            }

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    this.reset();

                    const successBox = document.getElementById('success-msg');
                    if (planSelected === 'Customize') {
                        successBox.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> Registration submitted! Admin will consult you soon to finalize your custom plan.';
                    } else {
                        successBox.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> Registration submitted successfully! Awaiting admin approval.';
                    }
                    successBox.classList.remove('hidden');

                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                } else {
                    alert("Submission failed: " + data.error);
                }
            } catch (err) {
                console.error(err);
                alert("Server connection error.");
            } finally {
                btn.disabled = false;
                const currentPlanState = document.getElementById('reg-plan').value;
                btn.innerText = currentPlanState === 'Customize' ? "Submit (Admin will consult you soon)" : "Submit Registration for Approval";
            }
        });
    </script>
</body>

</html>
