<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-md flex-shrink-0 relative z-10">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-500 p-2 rounded-lg">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span class="text-lg font-bold tracking-wide">Student Portal</span>
            </div>
            <div class="flex items-center space-x-4 text-sm">
                <span class="text-slate-300"><i class="fa-regular fa-calendar mr-1"></i> <span id="currentDateDisplay"></span></span>
                <button id="studentLogoutBtn" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg transition border border-slate-700">Logout</button>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-6 lg:p-8 max-w-5xl mx-auto w-full overflow-y-auto space-y-6">
        
        <!-- Login View -->
        <div id="login-section" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mt-12">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Member Login</h2>
            <p class="text-slate-500 text-sm mb-6">Enter your registered mobile number to view your membership and receipts.</p>
            
            <form id="studentLoginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Mobile Number</label>
                    <input type="text" id="login-mobile" required placeholder="e.g. 9876543210" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div id="login-error" class="hidden text-red-500 text-xs"></div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow-sm text-sm">
                    View Membership Details
                </button>
            </form>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-section" class="hidden space-y-6">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center gap-6">
                <img id="student-photo" src="" alt="Profile" class="w-24 h-24 rounded-full object-cover border-4 border-indigo-50 shadow-md">
                <div class="text-center sm:text-left">
                    <h2 class="text-2xl font-bold text-slate-900" id="student-name">--</h2>
                    <p class="text-slate-500 text-sm mt-1">Seat No: <span class="font-semibold text-slate-700" id="student-seat">--</span> | Shift: <span class="font-semibold text-slate-700" id="student-shift">--</span></p>
                    <span id="student-status-badge" class="inline-block mt-3 px-3 py-1 rounded-full text-xs font-bold uppercase">--</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs text-slate-500 font-semibold uppercase">Membership Plan</p>
                    <h3 class="text-xl font-bold text-slate-800 mt-1" id="student-plan">--</h3>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs text-slate-500 font-semibold uppercase">Fee Amount</p>
                    <h3 class="text-xl font-bold text-emerald-600 mt-1" id="student-fee">₹--</h3>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs text-slate-500 font-semibold uppercase">Next Due Date</p>
                    <h3 class="text-xl font-bold text-slate-800 mt-1" id="student-duedate">--</h3>
                </div>
            </div>

            <!-- Past Receipts Section -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-200 bg-slate-50">
                    <h3 class="text-base font-bold text-slate-900">Past Payment Receipts</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider">
                            <tr>
                                <th class="px-6 py-3 font-medium">Receipt No</th>
                                <th class="px-6 py-3 font-medium">Payment Date</th>
                                <th class="px-6 py-3 font-medium">Plan</th>
                                <th class="px-6 py-3 font-medium">Amount</th>
                                <th class="px-6 py-3 font-medium">Mode</th>
                                <th class="px-6 py-3 font-medium text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="receipts-table-body" class="text-sm divide-y divide-slate-200 text-slate-700">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        const today = new Date();
        document.getElementById('currentDateDisplay').innerText = today.toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
        const API_BASE = 'http://localhost:3000/api';
        let currentReceiptsList = [];

        const savedMobile = localStorage.getItem('studentMobile');
        if (savedMobile) {
            fetchStudentData(savedMobile);
        }

        document.getElementById('studentLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const mobileInput = document.getElementById('login-mobile').value.trim();
            fetchStudentData(mobileInput);
        });

        async function fetchStudentData(mobile) {
            const errorBox = document.getElementById('login-error');
            errorBox.classList.add('hidden');

            try {
                const response = await fetch(API_BASE + '/students');
                if (!response.ok) throw new Error('Network error');
                const students = await response.json();

                const student = students.find(function(s) { return s.mobile === mobile; });

                if (student) {
                    localStorage.setItem('studentMobile', student.mobile);
                    renderStudentDashboard(student);
                    fetchStudentReceipts(student.id);
                } else {
                    errorBox.innerText = "No student found with this mobile number.";
                    errorBox.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Error:", error);
                errorBox.innerText = "Could not connect to server.";
                errorBox.classList.remove('hidden');
            }
        }

        async function fetchStudentReceipts(studentId) {
            try {
                const response = await fetch(API_BASE + '/receipts/student/' + studentId);
                if (!response.ok) throw new Error('Failed to fetch receipts');
                currentReceiptsList = await response.json();
                renderReceiptsTable(currentReceiptsList);
            } catch (error) {
                console.error("Error fetching receipts:", error);
            }
        }

        function renderReceiptsTable(receipts) {
            const tbody = document.getElementById('receipts-table-body');
            tbody.innerHTML = '';

            if (receipts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-500">No past receipts found.</td></tr>';
                return;
            }

            receipts.forEach(function(r, index) {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                
                tr.innerHTML = 
                    '<td class="px-6 py-4 font-mono font-semibold text-slate-800">' + r.receipt_no + '</td>' +
                    '<td class="px-6 py-4 text-xs">' + r.payment_date + '</td>' +
                    '<td class="px-6 py-4 text-xs">' + r.plan + '</td>' +
                    '<td class="px-6 py-4 font-medium text-emerald-600">₹' + Number(r.fee).toLocaleString('en-IN') + '</td>' +
                    '<td class="px-6 py-4"><span class="px-2 py-1 rounded text-[10px] font-bold uppercase ' + (r.mode === 'UPI' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700') + '">' + r.mode + '</span></td>' +
                    '<td class="px-6 py-4 text-center">' +
                        '<button onclick="printReceiptByIndex(' + index + ')" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs transition shadow-sm">' +
                            '<i class="fa-solid fa-print mr-1"></i> Print' +
                        '</button>' +
                    '</td>';
                tbody.appendChild(tr);
            });
        }

        function printReceiptByIndex(index) {
            const r = currentReceiptsList[index];
            if (!r) return;

            const printWindow = window.open('', '_blank', 'width=800,height=600');
            printWindow.document.write(
                '<html>' +
                '<head>' +
                    '<title>Fee Receipt - ' + r.receipt_no + '</title>' +
                    '<style>' +
                        'body { font-family: Inter, sans-serif; padding: 40px; color: #334155; }' +
                        '.receipt-box { max-width: 600px; margin: auto; border: 1px solid #cbd5e1; padding: 30px; border-radius: 12px; }' +
                        '.header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }' +
                        '.header h2 { margin: 0; color: #0f172a; }' +
                        '.details { width: 100%; border-collapse: collapse; margin-top: 20px; }' +
                        '.details th, .details td { padding: 10px; border-bottom: 1px solid #f1f5f9; text-align: left; font-size: 14px; }' +
                        '.total { margin-top: 20px; text-align: right; font-size: 18px; font-weight: bold; color: #059669; }' +
                        '.footer { margin-top: 40px; text-align: center; font-size: 12px; color: #64748b; }' +
                    '</style>' +
                '</head>' +
                '<body>' +
                    '<div class="receipt-box">' +
                        '<div class="header">' +
                            '<h2>Library Management System</h2>' +
                            '<p>Official Fee Payment Receipt</p>' +
                        '</div>' +
                        '<p><strong>Receipt No:</strong> ' + r.receipt_no + '</p>' +
                        '<p><strong>Date:</strong> ' + r.payment_date + '</p>' +
                        '<table class="details">' +
                            '<tr><th>Student Name</th><td>' + r.student_name + '</td></tr>' +
                            '<tr><th>Seat No</th><td>' + r.seat_no + '</td></tr>' +
                            '<tr><th>Membership Plan</th><td>' + r.plan + '</td></tr>' +
                            '<tr><th>Payment Mode</th><td>' + r.mode + '</td></tr>' +
                        '</table>' +
                        '<div class="total">Total Paid: ₹' + Number(r.fee).toLocaleString('en-IN') + '</div>' +
                        '<div class="footer">Thank you for your payment! This is a computer-generated receipt.</div>' +
                    '</div>' +
                    '<script>' +
                        'window.onload = function() { window.print(); window.close(); }' +
                    '<\/script>' +
                '</body>' +
                '</html>'
            );
            printWindow.document.close();
        }

        function getDaysDiff(dueDateStr) {
            const dueDate = new Date(dueDateStr);
            const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const d = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
            return Math.ceil((d - t) / (1000 * 60 * 60 * 24));
        }

        function renderStudentDashboard(student) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');

            const photoUrl = student.photo ? 'http://localhost:3000' + student.photo : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(student.name) + '&background=4f46e5&color=fff';
            
            document.getElementById('student-photo').src = photoUrl;
            document.getElementById('student-name').innerText = student.name;
            document.getElementById('student-seat').innerText = student.seatNo;
            document.getElementById('student-shift').innerText = student.shift;
            document.getElementById('student-plan').innerText = student.plan;
            document.getElementById('student-fee').innerText = '₹' + Number(student.fee).toLocaleString('en-IN');
            document.getElementById('student-duedate').innerText = student.dueDate;

            const daysDiff = getDaysDiff(student.dueDate);
            const badge = document.getElementById('student-status-badge');
            if (daysDiff < 0) {
                badge.className = "inline-block mt-3 px-3 py-1 rounded-full text-xs font-bold uppercase bg-red-100 text-red-700";
                badge.innerText = "Status: Overdue Payment";
            } else if (daysDiff >= 0 && daysDiff <= 3) {
                badge.className = "inline-block mt-3 px-3 py-1 rounded-full text-xs font-bold uppercase bg-amber-100 text-amber-700";
                badge.innerText = "Status: Due Soon";
            } else {
                badge.className = "inline-block mt-3 px-3 py-1 rounded-full text-xs font-bold uppercase bg-emerald-100 text-emerald-700";
                badge.innerText = "Status: Active / Paid";
            }
        }

        document.getElementById('studentLogoutBtn').addEventListener('click', function() {
            localStorage.removeItem('studentMobile');
            currentReceiptsList = [];
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('studentLoginForm').reset();
        });
    </script>
</body>
</html>
